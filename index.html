<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fındıq hesabatı</title>
<style>
  html, body { margin: 0; padding: 0; background: #F5EFE0; width: 100%; }
  :root {
    --paper: #F5EFE0;
    --card: #EDE7D6;
    --ink: #1B2A5B;
    --ink-soft: #7A7263;
    --line: #DCD4BF;
    --line-soft: #E5DDC8;
    --white: #FFFDF8;
    --green: #3D6B4F;
    --green-bg: #E4EEE4;
    --red: #B5502E;
    --red-bg: #F3E4DC;
    --muted: #948C7A;
  }
  * { box-sizing: border-box; }
  svg { width: 16px; height: 16px; min-width: 16px; min-height: 16px; flex-shrink: 0; vertical-align: middle; display: inline-block; }
  #app {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--paper);
    min-height: 100vh;
    color: #2A2618;
    padding-bottom: 90px;
  }
  .header {
    padding: 18px 16px 8px;
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .header h1 { font-size: 20px; font-weight: 700; color: var(--ink); margin: 0; letter-spacing: -0.3px; }
  .header p { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; }
  .auth-btn {
    border: 1.5px solid var(--line); background: var(--white); color: var(--ink-soft);
    border-radius: 20px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; font-weight: 600;
    white-space: nowrap;
  }
  .auth-btn.signed-in { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .content { padding: 16px; max-width: 640px; margin: 0 auto; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 14px 16px; flex: 1; min-width: 130px; }
  .stat-card.green { background: var(--green-bg); }
  .stat-card.red { background: var(--red-bg); }
  .stat-label { font-size: 12.5px; opacity: 0.75; display: flex; align-items: center; gap: 6px; }
  .stat-card { color: var(--ink); }
  .stat-card.green { color: var(--green); }
  .stat-card.red { color: var(--red); }
  .stat-value { font-size: 22px; font-weight: 700; margin-top: 4px; letter-spacing: -0.3px; }
  .section { margin-bottom: 22px; }
  .section-title { font-size: 13px; font-weight: 600; color: var(--ink-soft); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .field-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .field { flex: 1; }
  .field label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; display: block; }
  input, select {
    width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 15px; background: var(--white); color: #2A2618; outline: none;
    font-family: inherit;
  }
  .btn {
    width: 100%; border: none; border-radius: 10px; padding: 12px 16px; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; color: var(--white);
    background: var(--ink);
  }
  .btn.green { background: var(--green); }
  .btn.red { background: var(--red); }
  .btn:disabled { background: #C9C2B0; cursor: default; }
  .btn-outline {
    width: 100%; background: var(--white); border: 1.5px solid var(--line); border-radius: 10px;
    padding: 11px 16px; font-size: 14px; color: var(--ink-soft); cursor: pointer;
  }
  .toggle-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .toggle-btn {
    flex: 1; padding: 9px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--white);
    color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .toggle-btn.active-green { border-color: var(--green); background: var(--green-bg); color: var(--green); }
  .toggle-btn.active-red { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  .toggle-btn.active-ink { border-color: var(--ink); background: var(--card); color: var(--ink); }
  .list-row {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 4px;
    border-bottom: 1px solid var(--line-soft); gap: 10px;
  }
  .list-row .title { font-size: 14.5px; font-weight: 500; }
  .list-row .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .list-row .right { font-size: 15px; font-weight: 700; flex-shrink: 0; }
  .list-row .right.green { color: var(--green); }
  .list-row .right.red { color: var(--red); }
  .history-scroll {
    max-height: 320px; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: 10px; padding: 0 10px;
  }
  .history-scroll .list-row:last-child { border-bottom: none; }
  .del-btn { background: none; border: none; color: var(--red); opacity: 0.5; cursor: pointer; padding: 4px; }
  .empty { color: var(--muted); font-size: 13.5px; }
  .chip { border: 1.5px solid var(--line); background: var(--white); color: var(--ink-soft); border-radius: 20px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; margin: 3px; }
  .chip.active { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--line-soft);
    display: flex; padding: 8px 4px 10px; overflow-x: auto; gap: 2px; z-index: 20;
  }
  .tab-btn {
    background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--muted); cursor: pointer; padding: 4px 10px; flex-shrink: 0; min-width: 58px; font-size: 10px; font-weight: 500;
  }
  .tab-btn.active { color: var(--ink); font-weight: 700; }
  .tab-btn svg { width: 19px; height: 19px; }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(27,42,91,0.35); display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: var(--white); border-radius: 16px; padding: 22px; width: 100%; max-width: 340px;
  }
  .modal h2 { font-size: 17px; color: var(--ink); margin: 0 0 14px; }
  .modal-err { color: var(--red); font-size: 12.5px; margin-bottom: 8px; min-height: 16px; }
  .card-box { background: var(--white); border: 1.5px solid var(--line-soft); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .report-box {
    background: var(--white); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px;
    white-space: pre-wrap; font-size: 13.5px; color: #2A2618; line-height: 1.6; margin-bottom: 16px; font-family: monospace;
  }
  .loading-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--paper); color: var(--muted); }
  .viewer-note { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 14px; }
  .time-note { font-size: 11.5px; color: var(--muted); margin: -4px 0 10px; }

  /* Desktop: sidebar navigation + full-width layout instead of a narrow mobile-style column */
  @media (min-width: 900px) {
    html, body { height: 100%; }
    #app {
      display: grid; grid-template-columns: 240px 1fr; grid-template-rows: auto 1fr;
      min-height: 100vh; padding-bottom: 0;
    }
    .header {
      grid-column: 2; grid-row: 1; width: 100%; max-width: none;
      padding: 26px 48px 16px; border-bottom: 1px solid var(--line-soft);
    }
    .tabbar {
      grid-column: 1; grid-row: 1 / span 2; position: sticky; top: 0; align-self: start;
      height: 100vh; width: 100%; max-width: none; flex-direction: column; align-items: stretch;
      justify-content: flex-start; gap: 4px; padding: 22px 14px; overflow-x: hidden; overflow-y: auto;
      border-top: none; border-right: 1px solid var(--line-soft); border-bottom: none;
    }
    .tab-btn {
      flex-direction: row; justify-content: flex-start; gap: 10px; padding: 10px 14px;
      border-radius: 10px; width: 100%; min-width: auto;
    }
    .tab-btn.active { background: var(--card); }
    .tab-btn svg { width: 18px; height: 18px; }
    .tab-btn span { font-size: 13px; }
    .content {
      grid-column: 2; grid-row: 2; width: 100%; max-width: 880px;
      padding: 28px 48px 60px;
    }
    .btn, .btn-outline { width: auto; max-width: 260px; padding: 10px 20px; font-size: 14px; }
    .toggle-btn { padding: 8px 16px; font-size: 13px; max-width: 230px; }
    .stat-row { flex-wrap: wrap; }
    .stat-card { min-width: 190px; }
    .stat-value { font-size: 20px; }
    .field-row { max-width: 620px; }
    input, select { padding: 9px 12px; font-size: 14.5px; }
    .card-box { max-width: 620px; }
  }
</style>
</head>
<body>

<div id="app"><div class="loading-screen">Yüklənir…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(function () {
  "use strict";

  // ---------- Firebase init ----------
  const firebaseConfig = {
    apiKey: "AIzaSyCTUqEoNTASFjQldIjYUD20vozb-4Qb1-A",
    authDomain: "findiq-baza.firebaseapp.com",
    projectId: "findiq-baza",
    storageBucket: "findiq-baza.firebasestorage.app",
    messagingSenderId: "364297020970",
    appId: "1:364297020970:web:d412423ed1d1b76b548553",
    measurementId: "G-Z8WNL6QZGW",
  };

  let fbApp, auth, db;
  let firebaseReady = false;
  try {
    fbApp = firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    firebaseReady = true;
  } catch (e) {
    console.error("Firebase init error", e);
  }

  const NUT_TYPES = ["Pasos", "Əl fındığı", "Digər"];
  const FUEL_TYPES = ["Dizel", "Benzin"];
  const CASH_SOURCE_LABELS = {
    purchase: "Alışlara",
    sale: "Satışlardan",
    expense: "Xərclərə",
    debt_gave: "Borc verilib",
    debt_took: "Borc alınıb",
    debt_repay: "Borc qaytarılması",
    manual: "Əl ilə əlavə/çıxarış",
    driver_advance: "Sürücüyə avans",
    driver_settle: "Sürücü hesabı",
    adjustment: "Düzəliş",
  };
  function buildCashBreakdown(entries) {
    const byIn = {};
    const byOut = {};
    entries.forEach((c) => {
      const key = c.source || "manual";
      const bucket = c.type === "in" ? byIn : byOut;
      bucket[key] = (bucket[key] || 0) + c.sum;
    });
    return { in: byIn, out: byOut };
  }
  // Driver advances/settlements just move cash out to a driver and back — they're not real
  // income or spending, and already have their own line in the Sürücülər section, so they're
  // excluded from "today's" Mədaxil/Kassadan çıxan totals to avoid double-counting.
  function reportableCash(entries) {
    return entries.filter((c) => c.source !== "driver_advance" && c.source !== "driver_settle");
  }
  const QUICK_EXPENSE_CATS = ["Xidmət", "Yemək", "Digər xərc"];

  function normalizeHeader(h) {
    return String(h || "").trim().replace(/İ/g, "i").toLowerCase()
      .replace(/ə/g, "e").replace(/ı/g, "i").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ç/g, "c").replace(/ş/g, "s").replace(/ğ/g, "g");
  }
  const SALES_HEADER_MAP = {
    tarix: "date", vaxt: "time",
    "kim aldi": "buyer", ad: "buyer", "musteri": "buyer",
    kq: "kg", kg: "kg",
    nov: "type", tip: "type",
    "mebleg": "sum", sum: "sum", "alinan mebleg": "sum",
    qeyd: "note", note: "note",
  };

  // ---------- State ----------
  const state = {
    tab: "report",
    user: null,
    authLoading: true,
    showLogin: false,
    loginError: "",
    purchases: [],
    sales: [],
    expenses: [],
    debts: [],
    cashLog: [],
    attendance: [],
    truckLoads: [],
    drivers: [],
    driverAdvances: [],
    driverReturns: [],
    workers: [],
    tractorists: [],
    fuelLog: [],
    dataLoaded: { purchases: false, sales: false, expenses: false, debts: false, cashLog: false, attendance: false, truckLoads: false, drivers: false, driverAdvances: false, driverReturns: false, workers: false, tractorists: false, fuelLog: false },
    // ephemeral form state per tab (kept simple, re-read from DOM on submit)
    reportDate: todayISO(),
    debtSearch: "",
    truckDate: todayISO(),
    truckEntries: [{ id: uid(), supplier: "", kg: "", bags: "" }],
    attendanceMonth: todayISO().slice(0, 7),
    salesImportPending: [],
    salesImportSkipped: 0,
    salesImportFileName: "",
    driversDate: todayISO(),
    kassaDate: todayISO(),
    purchasesDate: todayISO(),
    salesDate: todayISO(),
    fuelMonth: todayISO().slice(0, 7),
    masterImportPending: null,
    masterImportFileName: "",
    expenseDate: todayISO(),
  };

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }
  function nowTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  // Sorts a collection by its real creation time (ts), oldest first — Firestore's own
  // return order is not guaranteed to match the order things were actually entered.
  function sortByTs(arr) {
    return [...arr].sort((a, b) => (a.ts || 0) - (b.ts || 0));
  }
  function fmt(n) {
    const num = Number(n) || 0;
    return num.toLocaleString("az-AZ", { maximumFractionDigits: 2 });
  }
  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  const ICONS = {
    wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>',
    package: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>',
    receipt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6"/><path d="M14 12H8"/></svg>',
    hand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 12h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 14"/><path d="m7 20 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 15 6 6"/></svg>',
    calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62L18.5 8.5A1 1 0 0 0 17.7 8H14v10h1"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>',
    download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>',
    sell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7 13.5 15.5 8.5 10.5 2 17"/><path d="M16 7h6v6"/></svg>',
    driver: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>',
  };

  const TABS = [
    { id: "report", label: "Hesabat", icon: "send", ownerOnly: false },
    { id: "kassa", label: "Kassa", icon: "wallet", ownerOnly: true },
    { id: "purchases", label: "Alışlar", icon: "package", ownerOnly: true },
    { id: "sales", label: "Satışlar", icon: "sell", ownerOnly: true },
    { id: "expenses", label: "Xərclər", icon: "receipt", ownerOnly: true },
    { id: "debts", label: "Borclar", icon: "hand", ownerOnly: true },
    { id: "attendance", label: "Davamiyyət", icon: "calendar", ownerOnly: true },
    { id: "truck", label: "Nəqliyyat", icon: "truck", ownerOnly: true },
    { id: "drivers", label: "Sürücülər", icon: "driver", ownerOnly: true },
  ];

  // ---------- Firestore live sync ----------
  function attachListener(collectionName, stateKey) {
    if (!firebaseReady) return;
    db.collection(collectionName).onSnapshot(
      (snap) => {
        const arr = [];
        snap.forEach((doc) => arr.push({ id: doc.id, ...doc.data() }));
        state[stateKey] = arr;
        state.dataLoaded[stateKey] = true;
        render();
      },
      (err) => {
        console.error("Snapshot error", collectionName, err);
      }
    );
  }

  function initListeners() {
    attachListener("purchases", "purchases");
    attachListener("sales", "sales");
    attachListener("expenses", "expenses");
    attachListener("debts", "debts");
    attachListener("cashLog", "cashLog");
    attachListener("attendance", "attendance");
    attachListener("truckLoads", "truckLoads");
    attachListener("drivers", "drivers");
    attachListener("driverAdvances", "driverAdvances");
    attachListener("driverReturns", "driverReturns");
    attachListener("workers", "workers");
    attachListener("tractorists", "tractorists");
    attachListener("fuelLog", "fuelLog");
  }

  function cashBalance() {
    return state.cashLog.reduce((s, c) => s + (c.type === "in" ? c.sum : -c.sum), 0);
  }

  // ---------- Write helpers ----------
  async function addDoc(col, data) {
    try {
      return await db.collection(col).add(data);
    } catch (e) {
      alert("Xəta: " + e.message);
      return null;
    }
  }
  async function updateDoc(col, id, data) {
    try {
      await db.collection(col).doc(id).update(data);
    } catch (e) {
      alert("Xəta: " + e.message);
    }
  }
  async function deleteDoc(col, id) {
    try {
      await db.collection(col).doc(id).delete();
    } catch (e) {
      alert("Xəta: " + e.message);
    }
  }

  // Creates a cashLog entry stamped with a real creation time (ts) so history keeps the true order
  // in which actions actually happened, regardless of how Firestore returns the documents.
  async function logCash(date, type, sum, note, extra) {
    return await addDoc("cashLog", { date, type, sum, note, ts: Date.now(), ...(extra || {}) });
  }

  // Deletes the exact cashLog entry that was created together with a record (clean history).
  // Falls back to a compensating entry only for old records saved before this linking existed.
  async function removeLinkedCash(record, fallbackType, fallbackNote) {
    if (record && record.cashLogId) {
      await deleteDoc("cashLog", record.cashLogId);
    } else if (record) {
      await logCash(todayISO(), fallbackType, record.sum, fallbackNote, { source: "adjustment" });
    }
  }

  async function addPurchase(p) {
    const date = p.date || todayISO();
    const time = p.time || nowTime();
    const paidNow = p.paidNow !== undefined && p.paidNow !== null && p.paidNow !== "" ? Number(p.paidNow) : p.sum;
    const cashRef = await logCash(date, "out", paidNow, "Alış: " + p.supplier, { source: "purchase" });
    const entry = { ...p, date, time, paidNow, cashLogId: cashRef ? cashRef.id : null, ts: Date.now() };
    await addDoc("purchases", entry);
    const remainder = Number((p.sum - paidNow).toFixed(2));
    if (remainder > 0 && p.supplier) {
      // The unpaid part of a purchase is money we owe the supplier for goods already
      // received — not cash we borrowed, so it becomes a debt with no cash effect of its own.
      await addDebtNoCash({ person: p.supplier, sum: remainder, direction: "took", note: "Alış qalığı (" + date + ")" });
    }
  }

  function parseDateCell(raw, fallback) {
    if (!raw) return fallback;
    if (raw instanceof Date) return raw.toISOString().slice(0, 10);
    const s = String(raw).trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    return fallback;
  }
  function parseTimeCell(raw) {
    if (!raw) return "";
    if (raw instanceof Date) return String(raw.getHours()).padStart(2, "0") + ":" + String(raw.getMinutes()).padStart(2, "0");
    return String(raw).trim();
  }

  // ---------- Master daily bulk import (one Excel file, many sheets) ----------
  const MASTER_SHEET_DEFS = [
    { key: "alislar", sheetName: "Alışlar", headers: ["Tarix", "Vaxt", "Kim", "Kq", "Növ", "Məbləğ", "Kassadan ödənilən", "Qeyd"], example: ["", "10:00", "Nümunə Ad", 50, "Pasos", 175, 175, ""] },
    { key: "satislar", sheetName: "Satışlar", headers: ["Tarix", "Vaxt", "Kim", "Kq", "Növ", "Məbləğ", "Qeyd"], example: ["", "16:00", "Nümunə Ad", 20, "Pasos", 70, ""] },
    { key: "xercler", sheetName: "Xərclər", headers: ["Tarix", "Maddə", "Məbləğ", "Qeyd"], example: ["", "Nəqliyyat", 30, ""] },
    { key: "borclar", sheetName: "Borclar", headers: ["Tarix", "Ad", "Məbləğ", "İstiqamət", "Qeyd"], example: ["", "Nümunə Ad", 100, "Verdim", ""] },
    { key: "davamiyyet", sheetName: "Davamiyyət", headers: ["Tarix", "Ad"], example: ["", "Nümunə Ad"] },
    { key: "surucu avansi", sheetName: "Sürücü avansı", headers: ["Tarix", "Sürücü", "Məbləğ", "Qeyd"], example: ["", "Nümunə Sürücü", 500, ""] },
    { key: "surucu alislari", sheetName: "Sürücü alışları", headers: ["Tarix", "Vaxt", "Sürücü", "Kimdən", "Kq", "Kisə sayı", "Növ", "Məbləğ", "Ödənilib", "Qeyd"], example: ["", "11:00", "Nümunə Sürücü", "Satıcı adı", 30, 1, "Pasos", 105, "Xeyr", ""] },
    { key: "yanacaq", sheetName: "Yanacaq", headers: ["Tarix", "Vaxt", "Traktorist", "Litr", "Növ", "Qeyd"], example: ["", "08:00", "Nümunə Traktorist", 20, "Dizel", ""] },

  function downloadMasterTemplate() {
    const wb = XLSX.utils.book_new();
    MASTER_SHEET_DEFS.forEach((def) => {

  function buildColIndex(headerRow, headerMap) {
    const idx = {};
    headerRow.map(normalizeHeader).forEach((h, i) => {
      const key = headerMap[h];
      if (key && !(key in idx)) idx[key] = i;
    });
    return idx;
  }

  const MASTER_HEADER_MAPS = {
    alislar: { tarix: "date", vaxt: "time", kim: "who", kq: "kg", kg: "kg", nov: "type", tip: "type", mebleg: "sum", sum: "sum", "kassadan odenilen": "paidNow", qeyd: "note" },
    satislar: { tarix: "date", vaxt: "time", kim: "who", kq: "kg", kg: "kg", nov: "type", tip: "type", mebleg: "sum", sum: "sum", qeyd: "note" },
    xercler: { tarix: "date", madde: "category", mebleg: "sum", sum: "sum", qeyd: "note" },
    borclar: { tarix: "date", ad: "person", mebleg: "sum", sum: "sum", istiqamet: "direction", qeyd: "note" },
    davamiyyet: { tarix: "date", ad: "person" },
    "surucu avansi": { tarix: "date", surucu: "driver", mebleg: "sum", sum: "sum", qeyd: "note" },
    "surucu alislari": { tarix: "date", vaxt: "time", surucu: "driver", kimden: "seller", kq: "kg", kg: "kg", "kise sayi": "bags", nov: "type", tip: "type", mebleg: "sum", sum: "sum", odenilib: "paid", qeyd: "note" },
    yanacaq: { tarix: "date", vaxt: "time", traktorist: "tractorist", litr: "liters", nov: "type", tip: "type", qeyd: "note" },
  };

  function parseMasterRow(key, row, idx) {
    const get = (field) => (idx[field] !== undefined ? row[idx[field]] : "");
    const dateRaw = idx.date !== undefined ? row[idx.date] : null;
    if (key === "alislar" || key === "satislar") {
      const kg = Number(get("kg"));
      const sum = Number(get("sum"));
      if (!kg || !sum) return null;
      let type = String(get("type") || "").trim();
      if (!type) type = "Digər";
      const who = String(get("who") || "").trim() || "Müştəri";
      const paidNowRaw = get("paidNow");
      const base = { date: parseDateCell(dateRaw, todayISO()), time: parseTimeCell(idx.time !== undefined ? row[idx.time] : null), kg, type, sum, note: String(get("note") || "").trim() };
      if (key === "alislar") {
        const paidNow = paidNowRaw !== "" && paidNowRaw !== undefined && paidNowRaw !== null ? Number(paidNowRaw) : sum;
        return { ...base, supplier: who, price: Number((sum / kg).toFixed(2)), paidNow };
      }
      return { ...base, buyer: who };
    }
    if (key === "xercler") {
      const category = String(get("category") || "").trim();
      const sum = Number(get("sum"));
      if (!category || !sum) return null;
      return { date: parseDateCell(dateRaw, todayISO()), category, sum, note: String(get("note") || "").trim() };
    }
    if (key === "borclar") {
      const person = String(get("person") || "").trim();
      const sum = Number(get("sum"));
      if (!person || !sum) return null;
      const dirNorm = normalizeHeader(get("direction"));
      const direction = dirNorm.startsWith("ald") ? "took" : "gave";
      return { date: parseDateCell(dateRaw, todayISO()), person, sum, direction, note: String(get("note") || "").trim() };
    }
    if (key === "davamiyyet") {
      const person = String(get("person") || "").trim();
      if (!person) return null;
      return { date: parseDateCell(dateRaw, todayISO()), person };
    }
    if (key === "surucu avansi") {
      const driver = String(get("driver") || "").trim();
      const sum = Number(get("sum"));
      if (!driver || !sum) return null;
      return { date: parseDateCell(dateRaw, todayISO()), driver, sum, note: String(get("note") || "").trim() };
    }
    if (key === "surucu alislari") {
      const driver = String(get("driver") || "").trim();
      const kg = Number(get("kg"));
      const sum = Number(get("sum"));
      if (!driver || !kg || !sum) return null;
      let type = String(get("type") || "").trim();
      if (!type) type = "Digər";
      const paidNorm = normalizeHeader(get("paid"));
      const paid = paidNorm.startsWith("bel");
      return {
        date: parseDateCell(dateRaw, todayISO()), time: parseTimeCell(idx.time !== undefined ? row[idx.time] : null),
        driver, seller: String(get("seller") || "").trim(), kg, bags: Number(get("bags")) || 0, type, sum, paid,
        note: String(get("note") || "").trim(),
      };
    }
    if (key === "yanacaq") {
      const tractorist = String(get("tractorist") || "").trim();
      const liters = Number(get("liters"));
      if (!tractorist || !liters) return null;
      let type = String(get("type") || "").trim();
      if (!FUEL_TYPES.includes(type)) type = FUEL_TYPES[0];
      return {
        date: parseDateCell(dateRaw, todayISO()), time: parseTimeCell(idx.time !== undefined ? row[idx.time] : null),
        tractorist, liters, type, note: String(get("note") || "").trim(),
      };
    }
    return null;
  }

  const MASTER_SHEET_LABELS = { alislar: "Alışlar", satislar: "Satışlar", xercler: "Xərclər", borclar: "Borclar", davamiyyet: "Davamiyyət", "surucu avansi": "Sürücü avansı", "surucu alislari": "Sürücü alışları", yanacaq: "Yanacaq" };

  async function handleMasterImportFile(file) {
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array", cellDates: true });
      const result = {};
      MASTER_SHEET_DEFS.forEach((def) => {
        const sheetName = wb.SheetNames.find((n) => normalizeHeader(n) === def.key);
        if (!sheetName) return;
        const sheet = wb.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });
        if (!rows.length) return;
        const idx = buildColIndex(rows[0], MASTER_HEADER_MAPS[def.key]);
        const parsed = [];
        let skipped = 0;
        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (!row || row.every((c) => c === "" || c == null)) continue;
          const rec = parseMasterRow(def.key, row, idx);
          if (rec) parsed.push(rec); else skipped++;
        }
        if (parsed.length || skipped) result[def.key] = { rows: parsed, skipped };
      });
      if (Object.keys(result).length === 0) {
        alert("Faylda tanınan heç bir vərəq tapılmadı. Şablonu yoxlayın.");
        return;
      }
      state.masterImportPending = result;
      state.masterImportFileName = file.name;
      renderTabContent();
    } catch (e) {
      alert("Fayl oxuna bilmədi: " + e.message);
    }
  }

  async function commitMasterImport() {
    const data = state.masterImportPending;
    if (!data) return;
    const btn = document.getElementById("masterImportConfirm");
    const setProgress = (msg) => { if (btn) btn.textContent = msg; };

    if (data["alislar"]) {
      const rows = data["alislar"].rows;
      for (let i = 0; i < rows.length; i++) { setProgress(`Alışlar (${i + 1}/${rows.length})`); await addPurchase(rows[i]); }
    }
    if (data["satislar"]) {
      const rows = data["satislar"].rows;
      for (let i = 0; i < rows.length; i++) { setProgress(`Satışlar (${i + 1}/${rows.length})`); await addSale(rows[i]); }
    }
    if (data["xercler"]) {
      const rows = data["xercler"].rows;
      for (let i = 0; i < rows.length; i++) { setProgress(`Xərclər (${i + 1}/${rows.length})`); await addExpense(rows[i]); }
    }
    if (data["borclar"]) {
      const rows = data["borclar"].rows;
      for (let i = 0; i < rows.length; i++) { setProgress(`Borclar (${i + 1}/${rows.length})`); await addDebt(rows[i]); }
    }
    if (data["davamiyyet"]) {
      const rows = data["davamiyyet"].rows;
      for (let i = 0; i < rows.length; i++) {
        setProgress(`Davamiyyət (${i + 1}/${rows.length})`);
        const r = rows[i];
        await addWorker(r.person);
        const exists = state.attendance.some((a) => a.date === r.date && a.person === r.person);
        if (!exists) await addAttendance({ date: r.date, person: r.person });
      }
    }
    if (data["surucu avansi"]) {
      const rows = data["surucu avansi"].rows;
      for (let i = 0; i < rows.length; i++) {
        setProgress(`Sürücü avansı (${i + 1}/${rows.length})`);
        const r = rows[i];
        await addDriver(r.driver);
        await addDriverAdvance(r);
      }
    }
    if (data["surucu alislari"]) {
      const rows = data["surucu alislari"].rows;
      for (let i = 0; i < rows.length; i++) {
        setProgress(`Sürücü alışları (${i + 1}/${rows.length})`);
        const r = rows[i];
        await addDriver(r.driver);
        await addDriverPurchase(r);
      }
    }
    if (data["yanacaq"]) {
      const rows = data["yanacaq"].rows;
      for (let i = 0; i < rows.length; i++) {
        setProgress(`Yanacaq (${i + 1}/${rows.length})`);
        const r = rows[i];
        await addTractorist(r.tractorist);
        await addFuelLog(r);
      }
    }

    const total = Object.values(data).reduce((s, d) => s + d.rows.length, 0);
    state.masterImportPending = null;
    state.masterImportFileName = "";
    alert(`Toplu idxal tamamlandı: ${total} qeyd əlavə olundu`);
    renderTabContent();
  }

  async function handleSalesFile(file) {
    try {
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, { type: "array", cellDates: true });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: true, defval: "" });
      if (!rows.length) { alert("Fayl boşdur"); return; }
      const headers = rows[0].map(normalizeHeader);
      const idx = {};
      headers.forEach((h, i) => { const key = SALES_HEADER_MAP[h]; if (key && !(key in idx)) idx[key] = i; });
      if (idx.kg === undefined || idx.sum === undefined) {
        alert("Faylda 'Kq' və 'Məbləğ' sütunları tapılmadı. Şablonu yoxlayın.");
        return;
      }
      const parsed = [];
      let skipped = 0;
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        if (!row || row.every((c) => c === "" || c == null)) continue;
        const kg = Number(row[idx.kg]);
        const sum = Number(row[idx.sum]);
        if (!kg || !sum) { skipped++; continue; }
        let date = todayISO();
        if (idx.date !== undefined && row[idx.date]) {
          const raw = row[idx.date];
          if (raw instanceof Date) date = raw.toISOString().slice(0, 10);
          else {
            const s = String(raw).trim();
            if (/^\d{4}-\d{2}-\d{2}$/.test(s)) date = s;
            else {
              const m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
              if (m) date = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
            }
          }
        }
        let time = "";
        if (idx.time !== undefined && row[idx.time]) {
          const raw = row[idx.time];
          if (raw instanceof Date) time = String(raw.getHours()).padStart(2, "0") + ":" + String(raw.getMinutes()).padStart(2, "0");
          else time = String(raw).trim();
        }
        const buyer = idx.buyer !== undefined ? String(row[idx.buyer] || "").trim() : "";
        let type = idx.type !== undefined ? String(row[idx.type] || "").trim() : "";
        if (!type) type = "Digər";
        const note = idx.note !== undefined ? String(row[idx.note] || "").trim() : "";
        parsed.push({ date, time, buyer: buyer || "Müştəri", kg, type, sum, note });
      }
      state.salesImportPending = parsed;
      state.salesImportSkipped = skipped;
      state.salesImportFileName = file.name;
      renderTabContent();
    } catch (e) {
      alert("Fayl oxuna bilmədi: " + e.message);
    }
  }

  async function commitSalesImport() {
    const rows = state.salesImportPending || [];
    if (!rows.length) return;
    const btn = document.getElementById("salesImportConfirm");
    for (let i = 0; i < rows.length; i++) {
      if (btn) btn.textContent = `Yüklənir… (${i + 1}/${rows.length})`;
      const r = rows[i];
      const cashRef = await logCash(r.date, "in", r.sum, "Satış: " + r.buyer, { source: "sale" });
      await addDoc("sales", { date: r.date, time: r.time, buyer: r.buyer, kg: r.kg, type: r.type, sum: r.sum, note: r.note, cashLogId: cashRef ? cashRef.id : null, ts: Date.now() });
    }
    state.salesImportPending = [];
    state.salesImportSkipped = 0;
    state.salesImportFileName = "";
    alert(`İdxal tamamlandı: ${rows.length} qeyd əlavə olundu`);
    renderTabContent();
  }

  async function addDebt(d) {
    const date = d.date || todayISO();
    let cashRef;
    if (d.direction === "gave") {
      cashRef = await logCash(date, "out", d.sum, "Borc: " + d.person, { source: "debt_gave" });
    } else {
      cashRef = await logCash(date, "in", d.sum, "Borc alındı: " + d.person, { source: "debt_took" });
    }
    const entry = { paid: false, ...d, date, cashLogId: cashRef ? cashRef.id : null, ts: Date.now() };
    await addDoc("debts", entry);
  }
  // Records a debt without any cash movement — used when the "debt" represents unpaid
  // goods (e.g. a purchase not fully paid for) rather than actual cash changing hands.
  async function addDebtNoCash(d) {
    const date = d.date || todayISO();
    const entry = { paid: false, ...d, date, cashLogId: null, ts: Date.now() };
    await addDoc("debts", entry);
  }
  async function toggleDebtPaid(id) {
    const d = state.debts.find((x) => x.id === id);
    if (!d) return;
    if (!d.paid) {
      // Marking as paid: money actually moves — reflect it in the cash register
      const type = d.direction === "gave" ? "in" : "out";
      const note = "Borc qaytarıldı: " + d.person;
      const cashRef = await logCash(todayISO(), type, d.sum, note, { source: "debt_repay" });
      await updateDoc("debts", id, { paid: true, repayCashLogId: cashRef ? cashRef.id : null });
    } else {
      // Undo: remove the repayment's cash effect
      if (d.repayCashLogId) await deleteDoc("cashLog", d.repayCashLogId);
      await updateDoc("debts", id, { paid: false, repayCashLogId: null });
    }
  }
  async function deleteDebtFn(id) {
    const d = state.debts.find((x) => x.id === id);
    await deleteDoc("debts", id);
    if (d) {
      await removeLinkedCash(d, d.direction === "gave" ? "in" : "out", "Borc ləğv edildi: " + d.person);
      if (d.repayCashLogId) await deleteDoc("cashLog", d.repayCashLogId);
    }
  }

  async function addDriverReturn(r) {
    const date = r.date || todayISO();
    const cashRef = await logCash(date, "in", r.sum, "Sürücü qaytardı: " + r.driver, { source: "driver_settle" });
    await addDoc("driverReturns", { date, time: nowTime(), kg: 0, ...r, cashLogId: cashRef ? cashRef.id : null, ts: Date.now() });
  }
  async function deleteDriverReturn(id) {
    const r = state.driverReturns.find((x) => x.id === id);
    await deleteDoc("driverReturns", id);
    await removeLinkedCash(r, "out", "Sürücü qaytarması ləğv edildi: " + (r ? r.driver : ""));
  }

  // Builds a chronological ledger for one person's debts: every entry plus the running
  // balance after it, so "gave 500, got back 200" reads as a clear timeline ending at 300.
  function buildPersonDebtLedger(personName) {
    const entries = sortByTs(state.debts.filter((d) => d.person.toLowerCase() === personName.toLowerCase()));
    let balance = 0;
    const timeline = entries.map((d) => {
      balance += d.direction === "gave" ? d.sum : -d.sum;
      return { ...d, runningBalance: balance };
    });
    return { person: personName, timeline, finalBalance: Number(balance.toFixed(2)) };
  }

  function buildDriverSummaries(date) {
    const advances = state.driverAdvances.filter((a) => a.date === date);
    const returns = state.driverReturns.filter((r) => r.date === date);
    const names = Array.from(new Set([...advances.map((a) => a.driver), ...returns.map((r) => r.driver)]));
    return names.map((driver) => {
      const advance = advances.filter((a) => a.driver === driver).reduce((s, a) => s + a.sum, 0);
      const dr = returns.filter((r) => r.driver === driver);
      const kg = dr.reduce((s, r) => s + (r.kg || 0), 0);
      const returned = dr.reduce((s, r) => s + r.sum, 0);
      const remaining = Number((advance - returned).toFixed(2));
      return { driver, advance, kg, returned, remaining };
    });
  }

  function attachShellEvents() {
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) logoutBtn.onclick = doLogout;
    const loginOpenBtn = document.getElementById("loginOpenBtn");
    if (loginOpenBtn) loginOpenBtn.onclick = () => { state.showLogin = true; state.loginError = ""; render(); };
    const loginCancelBtn = document.getElementById("loginCancelBtn");
    if (loginCancelBtn) loginCancelBtn.onclick = () => { state.showLogin = false; render(); };
    const loginBackdrop = document.getElementById("loginBackdrop");
    if (loginBackdrop) loginBackdrop.addEventListener("click", (e) => { if (e.target === loginBackdrop) { state.showLogin = false; render(); } });
    const loginSubmitBtn = document.getElementById("loginSubmitBtn");
    if (loginSubmitBtn) {
      loginSubmitBtn.onclick = () => {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        if (!email || !password) return;
        doLogin(email, password);
      };
    }

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
    });
  }

  function renderTabContent() {
    const el = document.getElementById("tabContent");
    if (!el) return;

    // Re-rendering replaces the whole tab's HTML, which would normally kick the cursor
    // out of whatever input the person is typing in. Remember where the cursor was and
    // put it straight back after the new HTML is in place.
    const active = document.activeElement;
    const activeId = active && active.id ? active.id : null;
    const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

    if (state.tab === "report") el.innerHTML = renderReportTab();
    else if (state.tab === "kassa" && isOwner()) el.innerHTML = renderKassaTab();
    else if (state.tab === "purchases" && isOwner()) el.innerHTML = renderPurchasesTab();
    else if (state.tab === "sales" && isOwner()) el.innerHTML = renderSalesTab();
    else if (state.tab === "expenses" && isOwner()) el.innerHTML = renderExpensesTab();
    else if (state.tab === "debts" && isOwner()) el.innerHTML = renderDebtsTab();
    else if (state.tab === "attendance" && isOwner()) el.innerHTML = renderAttendanceTab();
    else if (state.tab === "truck" && isOwner()) el.innerHTML = renderTruckTab();
    else if (state.tab === "drivers" && isOwner()) el.innerHTML = renderDriversTab();
    else el.innerHTML = renderReportTab();
    attachTabEvents();

    if (activeId) {
      const restored = document.getElementById(activeId);
      if (restored) {
        restored.focus();
        if (selStart !== null && restored.setSelectionRange) {
          try { restored.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

        <datalist id="debtPersonsList">${allPersonNames.map((p) => `<option value="${esc(p)}"></option>`).join("")}</datalist>
        ${
          matchingPersons.length
            ? matchingPersons.map((personName) => {
                const ledger = buildPersonDebtLedger(personName);
                return `<div class="card-box">
                  <div style="font-weight:700;color:var(--ink);margin-bottom:8px;">${esc(personName)} — hesab tarixçəsi</div>
                  ${ledger.timeline.map((t) => `
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 0;border-top:1px solid var(--line-soft);">
                      <div>${esc(t.date)}${t.time ? " · " + esc(t.time) : ""} — ${t.direction === "gave" ? "borc verildi" : "qaytarıldı / alındı"}${t.note ? " (" + esc(t.note) + ")" : ""}</div>
                      <div style="text-align:right;flex-shrink:0;margin-left:8px;">
                        <div style="font-weight:700;color:${t.direction === "gave" ? "var(--red)" : "var(--green)"};">${t.direction === "gave" ? "+" : "−"}${fmt(t.sum)}</div>
                        <div style="font-size:11px;color:var(--muted);">qalıq ${fmt(t.runningBalance)}</div>
                      </div>
                    </div>`).join("")}
                  <div style="margin-top:10px;padding-top:8px;border-top:1.5px solid var(--line);font-weight:700;color:${ledger.finalBalance > 0 ? "var(--green)" : ledger.finalBalance < 0 ? "var(--red)" : "var(--ink)"};">
                    Cari qalıq: ${fmt(ledger.finalBalance)}${ledger.finalBalance > 0 ? " (bizə borcludur)" : ledger.finalBalance < 0 ? " (biz ona borcluyuq)" : ""}
                  </div>
                  ${
                    ledger.finalBalance !== 0
                      ? `<div class="field-row" style="margin-top:10px;">
                          <div class="field"><input class="ledgerRepaySum" type="number" inputmode="decimal" placeholder="Qaytarılan məbləğ" /></div>
                          <button class="btn-outline" style="width:auto;padding:9px 16px;flex-shrink:0;" data-repay-person="${esc(personName)}">${ledger.finalBalance > 0 ? "Aldım" : "Verdim"}</button>
                        </div>`
                      : ""
                  }
                </div>`;
              }).join("")
            : search
            ? '<div class="empty">Bu adda heç kim tapılmadı</div>'
            : ""
        }
      </div>

      <div class="section">
        <div class="section-title">Yeni borc</div>
        <div class="toggle-row">
          <button class="toggle-btn ${debtDirection === "gave" ? "active-green" : ""}" data-debt-dir="gave">Borc verdim</button>
          <button class="toggle-btn ${debtDirection === "took" ? "active-red" : ""}" data-debt-dir="took">Borc aldım</button>
        </div>
        <div class="field-row"><div class="field"><label>Ad</label><input id="dPerson" list="debtPersonsList" placeholder="Kimə / kimdən" /></div></div>
        <div class="field-row"><div class="field"><label>Məbləğ</label><input id="dSum" type="number" inputmode="decimal" placeholder="0" /></div></div>
        <div class="field-row"><div class="field"><label>Qeyd</label><input id="dNote" placeholder="məcburi deyil" /></div></div>
        <button class="btn ${debtDirection === "gave" ? "green" : "red"}" id="dSubmit">${ICONS.plus} Borcu qeyd et</button>
        <div class="time-note">Qismən qaytarma üçün: eyni adla "Borc aldım" seçib qaytarılan məbləği yaz — qalıq özü hesablanacaq.</div>
      </div>
      ${
        debtors.length
          ? `<div class="section"><div class="section-title">Kimin borcu var</div>
          ${debtors.map(([name, net]) => `
            <div class="list-row">
              <div class="title">${esc(name)}</div>
              <div class="right ${net > 0 ? "green" : net < 0 ? "red" : ""}" style="${net === 0 ? "color:var(--muted);" : ""}">${net > 0 ? "+" : ""}${fmt(net)}</div>
            </div>`).join("")}
          </div>`
          : ""
      }
      <div class="section">
        <div class="section-title">Bütün borclar (${state.debts.length})</div>
        ${
          filtered.length === 0
            ? '<div class="empty">Nəticə yoxdur</div>'
            : sortByTs(filtered).reverse().map((d) => `
              <div class="list-row" style="opacity:${d.paid ? 0.45 : 1};">
                <div>
                  <div class="title" style="${d.paid ? "text-decoration:line-through;" : ""}">${esc(d.person)} ${d.direction === "gave" ? "(bizə borcludur)" : "(biz borcluyuq)"}</div>
                  <div class="meta">${esc(d.date)}${d.note ? " · " + esc(d.note) : ""}</div>
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="right ${d.direction === "gave" ? "green" : "red"}">${fmt(d.sum)}</div>
                  <button class="btn-outline" style="width:auto;padding:4px 8px;font-size:11px;" data-toggle-debt="${d.id}">${d.paid ? "Geri qaytar" : "Ödənildi"}</button>
                  <button class="del-btn" data-del-debt="${d.id}">${ICONS.trash}</button>
                </div>
              </div>`).join("")
        }
      </div>
    `;
  }

  // ---------- Attendance ----------
  function renderAttendanceTab() {
    const month = state.attendanceMonth;
    const numDays = daysInMonth(month);
    const days = Array.from({ length: numDays }, (_, i) => i + 1);
    const monthAttendance = state.attendance.filter((a) => a.date.startsWith(month));
    const presentSet = new Set(monthAttendance.map((a) => a.date + "|" + a.person));
    const totals = {};
    state.workers.forEach((w) => { totals[w.name] = monthAttendance.filter((a) => a.person === w.name).length; });

    return `
      <div class="section"><div class="section-title">Ay</div>
        <div class="field-row"><div class="field"><input id="attMonth" type="month" value="${esc(month)}" /></div></div>
      </div>

      <div class="section">
        <div class="section-title">İşçilər</div>
        <div class="field-row"><div class="field"><input id="workerNameInput" placeholder="Ad" /></div></div>
        <div style="margin-bottom:10px;"><button class="btn-outline" id="addWorkerBtn">${ICONS.plus} İşçi əlavə et</button></div>
        <div>
          ${
            state.workers.length === 0
              ? '<div class="empty">Hələ işçi əlavə edilməyib</div>'
              : state.workers.map((w) => `
                <span class="chip" style="cursor:default;">${esc(w.name)}
                  <button data-del-worker="${w.id}" style="background:none;border:none;color:var(--red);opacity:0.6;cursor:pointer;margin-left:4px;">✕</button>
                </span>`).join("")
          }
        </div>
      </div>

      <div class="section">
        <div class="section-title">Davamiyyət cədvəli — ${esc(month)}</div>
        ${
          state.workers.length === 0
            ? '<div class="empty">Əvvəlcə işçi əlavə edin</div>'
            : `<div style="overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line-soft); border-radius:10px;">
                <table style="border-collapse:collapse; font-size:12px; white-space:nowrap; width:100%;">
                  <thead>
                    <tr>
                      <th style="position:sticky; left:0; background:var(--white); padding:8px 12px; text-align:left; border-bottom:1.5px solid var(--line); z-index:2;">Ad</th>
                      ${days.map((d) => `<th style="padding:6px 5px; text-align:center; border-bottom:1.5px solid var(--line); color:var(--muted); font-weight:600;">${d}</th>`).join("")}
                      <th style="padding:8px 12px; text-align:center; border-bottom:1.5px solid var(--line); color:var(--ink); font-weight:700; background:var(--card);">Cəmi</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${state.workers.map((w) => `
                      <tr>
                        <td style="position:sticky; left:0; background:var(--white); padding:8px 12px; font-weight:600; border-bottom:1px solid var(--line-soft);">${esc(w.name)}</td>
                        ${days.map((d) => {
                          const dateStr = `${month}-${String(d).padStart(2, "0")}`;
                          const present = presentSet.has(dateStr + "|" + w.name);
                          return `<td style="padding:3px; text-align:center; border-bottom:1px solid var(--line-soft);">
                            <button data-att-cell="${esc(w.name)}|${dateStr}" style="width:24px;height:24px;border-radius:6px;border:1.5px solid ${present ? "var(--green)" : "var(--line)"};background:${present ? "var(--green-bg)" : "#fff"};color:${present ? "var(--green)" : "var(--muted)"};cursor:pointer;font-weight:700;font-size:12px;line-height:1;">${present ? "✓" : ""}</button>
                          </td>`;
                        }).join("")}
                        <td style="padding:8px 12px; text-align:center; font-weight:700; color:var(--ink); border-bottom:1px solid var(--line-soft); background:var(--card);">${totals[w.name] || 0}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>`
        }
      </div>
    `;
  }

  // ---------- Truck ----------
  let fuelType = FUEL_TYPES[0];
  function renderTruckTab() {
    const driverOptionsForTruck = state.drivers.map((d) => `<option value="${esc(d.name)}"></option>`).join("");

    const validEntries = state.truckEntries.filter((e) => e.supplier.trim() && e.kg);
    const totalKg = validEntries.reduce((s, e) => s + Number(e.kg || 0), 0);
    const totalBags = validEntries.reduce((s, e) => s + Number(e.bags || 0), 0);

    const dayLoads = state.truckLoads.filter((t) => t.date === state.truckDate);

    let entriesHtml = state.truckEntries.map((e, idx) => `
        <div class="card-box" data-truck-row="${e.id}">
          <div class="field-row">
            <div class="field"><label>Kim apardı</label><input class="truckSupplier" list="truckDriverNamesList" data-row="${e.id}" value="${esc(e.supplier)}" placeholder="Ad" /></div>
            ${state.truckEntries.length > 1 ? `<button class="del-btn" style="align-self:flex-end;padding:10px 4px;" data-del-truck-row="${e.id}">${ICONS.trash}</button>` : ""}
          </div>
          <div class="field-row">
            <div class="field"><label>Kq (çəkidə)</label><input class="truckKg" data-row="${e.id}" type="number" inputmode="decimal" value="${esc(e.kg)}" placeholder="0" /></div>
            <div class="field"><label>Kisə sayı</label><input class="truckBags" data-row="${e.id}" type="number" inputmode="decimal" value="${esc(e.bags)}" placeholder="0" /></div>
          </div>
        </div>
      `).join("");
    entriesHtml = `<datalist id="truckDriverNamesList">${driverOptionsForTruck}</datalist>` + entriesHtml;

    let loadsHtml = sortByTs(dayLoads).reverse().map((t) => {
      const loadKg = t.entries.reduce((s, e) => s + e.kg, 0);
      const loadBags = t.entries.reduce((s, e) => s + e.bags, 0);
      const rows = t.entries.map((e) => `<div style="font-size:13px;color:#2A2618;padding:4px 0;border-top:1px solid var(--line-soft);">
          ${esc(e.supplier)} — ${fmt(e.kg)} kq${e.bags ? " (" + e.bags + " kisə)" : ""}
        </div>`).join("");
      return `<div class="card-box">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <div style="font-weight:700;color:var(--ink);">${esc(t.driver)}</div>
          <button class="del-btn" data-del-truck="${t.id}">${ICONS.trash}</button>
        </div>
        ${rows}
        <div style="font-size:13px;font-weight:700;margin-top:6px;color:var(--ink);">Cəmi: ${fmt(loadKg)} kq · ${fmt(loadBags)} kisə</div>
        ${t.note ? `<div style="font-size:12px;color:var(--muted);margin-top:4px;">${esc(t.note)}</div>` : ""}
      </div>`;
    }).join("");

    const dayFuel = state.fuelLog.filter((f) => f.date === state.truckDate);
    const dayFuelByTractorist = {};
    dayFuel.forEach((f) => { dayFuelByTractorist[f.tractorist] = (dayFuelByTractorist[f.tractorist] || 0) + f.liters; });

    const monthFuel = state.fuelLog.filter((f) => f.date.startsWith(state.fuelMonth));
    const monthFuelByTractorist = {};
    state.tractorists.forEach((t) => { monthFuelByTractorist[t.name] = monthFuel.filter((f) => f.tractorist === t.name).reduce((s, f) => s + f.liters, 0); });

    const tractoristOptions = state.tractorists.map((t) => `<option value="${esc(t.name)}"></option>`).join("");

    const dayLoads2 = dayLoads;
    const byCarrier = {};
    dayLoads2.forEach((t) => {
      t.entries.forEach((e) => {
        if (!byCarrier[e.supplier]) byCarrier[e.supplier] = { kg: 0, bags: 0 };
        byCarrier[e.supplier].kg += e.kg;
        byCarrier[e.supplier].bags += e.bags;
      });
    });
    const carrierRows = Object.entries(byCarrier);
    const carrierTableHtml = carrierRows.length
      ? `<div style="overflow-x:auto; border:1px solid var(--line-soft); border-radius:10px;">
          <table style="border-collapse:collapse; width:100%; font-size:13px;">
            <thead>
              <tr>
                <th style="padding:8px 12px; text-align:left; border-bottom:1.5px solid var(--line); color:var(--muted); font-weight:600;">Kim apardı</th>
                <th style="padding:8px 12px; text-align:right; border-bottom:1.5px solid var(--line); color:var(--muted); font-weight:600;">Kq</th>
                <th style="padding:8px 12px; text-align:right; border-bottom:1.5px solid var(--line); color:var(--muted); font-weight:600;">Kisə</th>
              </tr>
            </thead>
            <tbody>
              ${carrierRows.map(([name, v]) => `
                <tr>
                  <td style="padding:8px 12px; border-bottom:1px solid var(--line-soft); font-weight:600; color:var(--ink);">${esc(name)}</td>
                  <td style="padding:8px 12px; text-align:right; border-bottom:1px solid var(--line-soft);">${fmt(v.kg)}</td>
                  <td style="padding:8px 12px; text-align:right; border-bottom:1px solid var(--line-soft);">${fmt(v.bags)}</td>
                </tr>
              `).join("")}
              <tr>
                <td style="padding:8px 12px; font-weight:700; color:var(--ink);">CƏMİ</td>
                <td style="padding:8px 12px; text-align:right; font-weight:700; color:var(--ink);">${fmt(carrierRows.reduce((s, [, v]) => s + v.kg, 0))}</td>
                <td style="padding:8px 12px; text-align:right; font-weight:700; color:var(--ink);">${fmt(carrierRows.reduce((s, [, v]) => s + v.bags, 0))}</td>
              </tr>
            </tbody>
          </table>
        </div>`
      : '<div class="empty">Hələ məlumat yoxdur</div>';

    return `
      <div class="section"><div class="section-title">Tarix (siyahı üçün)</div>
        <div class="field-row"><div class="field"><input id="truckDate" type="date" value="${esc(state.truckDate)}" /></div></div>
      </div>
      <div class="section">
        <div class="section-title">Göndərilən maşın və yükü</div>
        <div class="field-row"><div class="field"><label>Sürücü</label><input id="truckDriver" placeholder="Sürücünün adı" /></div></div>
        <div class="field-row"><div class="field"><label>Göndərilmə tarixi</label><input id="truckLoadDate" type="date" value="${esc(state.truckDate)}" /></div></div>
        ${entriesHtml}
        <div style="margin-bottom:10px;"><button class="btn-outline" id="truckAddRow" style="border-style:dashed;">+ Sətir əlavə et</button></div>
        <div class="field-row"><div class="field"><label>Qeyd</label><input id="truckNote" placeholder="məcburi deyil" /></div></div>
        ${validEntries.length ? `<div style="text-align:center;font-size:14px;color:var(--ink);margin-bottom:10px;">Cəmi: <b>${fmt(totalKg)} kq</b> · <b>${fmt(totalBags)} kisə</b></div>` : ""}
        <button class="btn" id="truckSubmit">${ICONS.plus} Maşını qeyd et</button>
        <div class="time-note">Əvvəlki günlərdə göndərilmiş maşını əlavə etmək üçün "Göndərilmə tarixi"ni dəyişin.</div>
      </div>
      <div class="section">
        <div class="section-title">${esc(state.truckDate)} — kim, nə qədər apardı</div>
        ${carrierTableHtml}
      </div>
      <div class="section">
        <div class="section-title">${esc(state.truckDate)} tarixində göndərilən maşınlar (təfərrüat)</div>
        ${dayLoads.length === 0 ? '<div class="empty">Hələ maşın qeyd olunmayıb</div>' : loadsHtml}
      </div>

      <div class="section">
        <div class="section-title">Traktoristlər</div>
        <div class="field-row"><div class="field"><input id="tractoristNameInput" placeholder="Ad" /></div></div>
        <div style="margin-bottom:10px;"><button class="btn-outline" id="addTractoristBtn">${ICONS.plus} Traktorist əlavə et</button></div>
        <div>
          ${
            state.tractorists.length === 0
              ? '<div class="empty">Hələ traktorist əlavə edilməyib</div>'
              : state.tractorists.map((t) => `
                <span class="chip" style="cursor:default;">${esc(t.name)}
                  <button data-del-tractorist="${t.id}" style="background:none;border:none;color:var(--red);opacity:0.6;cursor:pointer;margin-left:4px;">✕</button>
                </span>`).join("")
          }
        </div>
      </div>

      <datalist id="tractoristNamesList">${tractoristOptions}</datalist>

      <div class="section">
        <div class="section-title">Yanacaq qeydi</div>
        <div class="field-row"><div class="field"><label>Traktorist</label><input id="fuelTractorist" list="tractoristNamesList" placeholder="Ad" /></div></div>
        <div class="field-row"><div class="field"><label>Tarix</label><input id="fuelDate" type="date" value="${esc(state.truckDate)}" /></div></div>
        <div class="toggle-row">
          ${FUEL_TYPES.map((t) => `<button class="toggle-btn ${fuelType === t ? "active-ink" : ""}" data-fuel-type="${esc(t)}">${esc(t)}</button>`).join("")}
        </div>
        <div class="field-row"><div class="field"><label>Litr</label><input id="fuelLiters" type="number" inputmode="decimal" placeholder="0" /></div></div>
        <div class="field-row"><div class="field"><label>Qeyd</label><input id="fuelNote" placeholder="məcburi deyil" /></div></div>
        <button class="btn red" id="fuelSubmit">${ICONS.plus} Yanacağı qeyd et</button>
        <div class="time-note">Ayın başqa günü üçün dizel əlavə etmək istəsən, yuxarıdakı "Tarix"i dəyişib yaz.</div>
      </div>

      <div class="section">
        <div class="section-title">${esc(state.truckDate)} — bugünkü yanacaq</div>
        ${
          Object.keys(dayFuelByTractorist).length === 0
            ? '<div class="empty">Bu gün yanacaq qeydi yoxdur</div>'
            : Object.entries(dayFuelByTractorist).map(([name, litr]) => `
              <div class="list-row"><div class="title">${esc(name)}</div><div class="right red">${fmt(litr)} litr</div></div>
            `).join("")
        }
        <div class="history-scroll" style="margin-top:8px;">
          ${
            dayFuel.length === 0
              ? ""
              : sortByTs(dayFuel).reverse().map((f) => `
                <div class="list-row">
                  <div><div class="title">${esc(f.tractorist)} — ${fmt(f.liters)} litr (${esc(f.type || "")})</div><div class="meta">${esc(f.date)}${f.time ? " · " + esc(f.time) : ""}${f.note ? " · " + esc(f.note) : ""}</div></div>
                  <button class="del-btn" data-del-fuel="${f.id}">${ICONS.trash}</button>
                </div>`).join("")
          }
        </div>
      </div>

      <div class="section">
        <div class="section-title">Aylıq yanacaq hesabı</div>
        <div class="field-row"><div class="field"><input id="fuelMonth" type="month" value="${esc(state.fuelMonth)}" /></div></div>
        ${
          state.tractorists.length === 0
            ? '<div class="empty">Əvvəlcə traktorist əlavə edin</div>'
            : state.tractorists.map((t) => `
              <div class="list-row"><div class="title">${esc(t.name)}</div><div class="right">${fmt(monthFuelByTractorist[t.name] || 0)} litr</div></div>
            `).join("")
        }
      </div>
    `;
  }

  // ---------- Drivers (Sürücülər) ----------
  function renderDriversTab() {
    const date = state.driversDate;
    const summaries = buildDriverSummaries(date);
    const advDay = state.driverAdvances.filter((a) => a.date === date);
    const returnDay = state.driverReturns.filter((r) => r.date === date);

    const driverOptions = state.drivers.map((d) => `<option value="${esc(d.name)}"></option>`).join("");

    return `
      <div class="section"><div class="section-title">Tarix</div>
        <div class="field-row"><div class="field"><input id="driversDate" type="date" value="${esc(date)}" /></div></div>
      </div>

      <div class="section">
        <div class="section-title">Sürücülər</div>
        <div class="field-row"><div class="field"><input id="driverNameInput" placeholder="Sürücünün adı" /></div></div>
        <div style="margin-bottom:10px;"><button class="btn-outline" id="addDriverBtn">${ICONS.plus} Sürücü əlavə et</button></div>
        <div>
          ${
            state.drivers.length === 0
              ? '<div class="empty">Hələ sürücü əlavə edilməyib</div>'
              : state.drivers.map((d) => `
                <span class="chip" style="cursor:default;">${esc(d.name)}
                  <button data-del-driver="${d.id}" style="background:none;border:none;color:var(--red);opacity:0.6;cursor:pointer;margin-left:4px;">✕</button>
                </span>`).join("")
          }
        </div>
      </div>

      <datalist id="driverNamesList">${driverOptions}</datalist>

      <div class="section">
        <div class="section-title">Sürücüyə avans ver (səhər)</div>
        <div class="field-row"><div class="field"><label>Sürücü</label><input id="advDriver" list="driverNamesList" placeholder="Ad" /></div></div>
        <div class="field-row"><div class="field"><label>Məbləğ</label><input id="advSum" type="number" inputmode="decimal" placeholder="0" /></div></div>
        <div class="field-row"><div class="field"><label>Qeyd</label><input id="advNote" placeholder="məcburi deyil" /></div></div>
        <button class="btn red" id="advSubmit">${ICONS.plus} Avansı qeyd et</button>
      </div>

      <div class="section">
        <div class="section-title">Sürücü qaytardı (axşam)</div>

  // ---------- Report ----------
  function buildReportData(reportDate) {
    const purchases = state.purchases.filter((p) => p.date === reportDate);
    const sales = state.sales.filter((s) => s.date === reportDate);
    const expenses = state.expenses.filter((e) => e.date === reportDate);
    const cashLog = state.cashLog.filter((c) => c.date === reportDate);
    const debts = state.debts.filter((d) => d.date === reportDate);
    const attendanceDay = state.attendance.filter((a) => a.date === reportDate);
    const truckDay = state.truckLoads.filter((t) => t.date === reportDate);

    const totalKg = purchases.reduce((s, p) => s + p.kg, 0);
    const totalPurchaseSum = purchases.reduce((s, p) => s + p.sum, 0);
    const totalSalesKg = sales.reduce((s, x) => s + x.kg, 0);
    const totalSalesSum = sales.reduce((s, x) => s + x.sum, 0);
    const totalExpenses = expenses.reduce((s, e) => s + e.sum, 0);
    const reportableCashLog = reportableCash(cashLog);
    const cashIn = reportableCashLog.filter((c) => c.type === "in").reduce((s, c) => s + c.sum, 0);
    const cashOut = reportableCashLog.filter((c) => c.type === "out").reduce((s, c) => s + c.sum, 0);
    const truckTotalKg = truckDay.reduce((s, t) => s + t.entries.reduce((s2, e) => s2 + e.kg, 0), 0);
    const truckTotalBags = truckDay.reduce((s, t) => s + t.entries.reduce((s2, e) => s2 + e.bags, 0), 0);
    const driverAdvancesDay = state.driverAdvances.filter((a) => a.date === reportDate);
    const driverReturnsDay = state.driverReturns.filter((r) => r.date === reportDate);
    const driverSummaries = buildDriverSummaries(reportDate);
    const fuelDay = state.fuelLog.filter((f) => f.date === reportDate);
    const fuelByTractorist = {};
    fuelDay.forEach((f) => { fuelByTractorist[f.tractorist] = (fuelByTractorist[f.tractorist] || 0) + f.liters; });
    const fuelTotalLiters = fuelDay.reduce((s, f) => s + f.liters, 0);
    const cashBreakdown = buildCashBreakdown(reportableCashLog);
    const dayBalance = cashLog.reduce((s, c) => s + (c.type === "in" ? c.sum : -c.sum), 0);

    return { purchases, sales, expenses, cashLog, debts, attendanceDay, truckDay, totalKg, totalPurchaseSum, totalSalesKg, totalSalesSum, totalExpenses, cashIn, cashOut, truckTotalKg, truckTotalBags, driverAdvancesDay, driverReturnsDay, driverSummaries, fuelDay, fuelByTractorist, fuelTotalLiters, cashBreakdown, dayBalance };
  }

  function buildReportText(reportDate) {
    const r = buildReportData(reportDate);

    const purchaseTypeGroups = {};
    r.purchases.forEach((p) => {
      const t = p.type || "Digər";
      if (!purchaseTypeGroups[t]) purchaseTypeGroups[t] = { kg: 0, sum: 0 };
      purchaseTypeGroups[t].kg += p.kg;
      purchaseTypeGroups[t].sum += p.sum;
    });
    const purchaseTypeLines = Object.keys(purchaseTypeGroups).map((t) => {
      const g = purchaseTypeGroups[t];
      const avg = g.kg ? g.sum / g.kg : 0;
      return `• ${t}: ${fmt(g.kg)} kq — ${fmt(g.sum)} manat (orta ${fmt(avg)}/kq)`;
    });
    const purchaseAvg = r.totalKg ? r.totalPurchaseSum / r.totalKg : 0;

    return `📋 ${reportDate} hesabatı

👷 Davamiyyət: ${r.attendanceDay.length} nəfər işdə olub

🌰 Fındıq alışı:
${purchaseTypeLines.length ? purchaseTypeLines.join("\n") : "qeyd yoxdur"}
Cəmi: ${fmt(r.totalKg)} kq, məbləğ ${fmt(r.totalPurchaseSum)}${r.totalKg ? ` (orta ${fmt(purchaseAvg)}/kq)` : ""}

🛒 Satışlar:
Cəmi: ${fmt(r.totalSalesKg)} kq, məbləğ ${fmt(r.totalSalesSum)}

🚗 Sürücülər:
${r.driverSummaries.length ? r.driverSummaries.map((d) => `• ${d.driver}: avans ${fmt(d.advance)}${d.kg ? `, gətirdiyi ${fmt(d.kg)} kq` : ""}, qaytardığı ${fmt(d.returned)} manat — qalıq ${fmt(d.remaining)}`).join("\n") : "qeyd yoxdur"}

💵 Kassa:
Mədaxil: +${fmt(r.cashIn)}${Object.entries(r.cashBreakdown.in).map(([src, sum]) => `\n  · ${CASH_SOURCE_LABELS[src] || src}: +${fmt(sum)}`).join("")}
Kassadan çıxan: −${fmt(r.cashOut)}${Object.entries(r.cashBreakdown.out).map(([src, sum]) => `\n  · ${CASH_SOURCE_LABELS[src] || src}: −${fmt(sum)}`).join("")}
Kassada qalıq (bu gün üçün): ${fmt(r.dayBalance)}

🧾 Xərclər:
${r.expenses.length ? r.expenses.map((e) => `• ${e.category}: ${fmt(e.sum)}${e.note ? " (" + e.note + ")" : ""}`).join("\n") : "qeyd yoxdur"}
Cəmi xərclər: ${fmt(r.totalExpenses)}

🤝 Borclar (bu gün):
${r.debts.length ? r.debts.map((d) => `• ${d.person}: ${fmt(d.sum)} — ${d.direction === "gave" ? "bizə borcludur" : "biz borcluyuq"}`).join("\n") : "yeni qeyd yoxdur"}

🚚 Maşın:
${r.truckDay.length ? r.truckDay.map((t) => `• Sürücü: ${t.driver} — ${fmt(t.entries.reduce((s, e) => s + e.kg, 0))} kq, ${fmt(t.entries.reduce((s, e) => s + e.bags, 0))} kisə`).join("\n") : "göndərilməyib"}
${r.truckDay.length ? `Cəmi göndərilib: ${fmt(r.truckTotalKg)} kq, ${fmt(r.truckTotalBags)} kisə` : ""}

⛽ Yanacaq:
${Object.keys(r.fuelByTractorist).length ? Object.entries(r.fuelByTractorist).map(([n, l]) => `• ${n}: ${fmt(l)} litr`).join("\n") : "qeyd yoxdur"}
${r.fuelDay.length ? `Cəmi: ${fmt(r.fuelTotalLiters)} litr` : ""}`;
  }
