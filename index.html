  function downloadAllExcel() {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.purchases.map((p) => ({ Tarix: p.date, Vaxt: p.time || "", "Kim təhvil verdi": p.supplier, Kq: p.kg, Növ: p.type || "", "Orta qiymət (kq)": p.price || "", Məbləğ: p.sum, "Kassadan ödənilən": p.paidNow !== undefined ? p.paidNow : p.sum, Qeyd: p.note || "" }))), "Alışlar");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.sales.map((s) => ({ Tarix: s.date, Vaxt: s.time || "", "Kim aldı": s.buyer, Kq: s.kg, Növ: s.type || "", Məbləğ: s.sum, Qeyd: s.note || "" }))), "Satışlar");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.expenses.map((e) => ({ Tarix: e.date, Maddə: e.category, Məbləğ: e.sum, Qeyd: e.note || "" }))), "Xərclər");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.cashLog.map((c) => ({ Tarix: c.date, Növ: c.type === "in" ? "Mədaxil" : "Çıxarış", Məbləğ: c.sum, Qeyd: c.note || "" }))), "Kassa");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.debts.map((d) => ({ Tarix: d.date, Ad: d.person, Məbləğ: d.sum, İstiqamət: d.direction === "gave" ? "Bizə borcludur" : "Biz borcluyuq", Ödənilib: d.paid ? "Bəli" : "Xeyr", Qeyd: d.note || "" }))), "Borclar");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.attendance.map((a) => ({ Tarix: a.date, Ad: a.person }))), "Davamiyyət");
    const truckRowsAll = [];
    state.truckLoads.forEach((t) => {
      t.entries.forEach((e) => {
        truckRowsAll.push({ Tarix: t.date, Sürücü: t.driver, "Kim apardı": e.supplier, "Maşında kq": e.kg, "Kisə sayı": e.bags });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(truckRowsAll.length ? truckRowsAll : [{ Tarix: "", Sürücü: "qeyd yoxdur" }]), "Maşın");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.driverAdvances.map((a) => ({ Tarix: a.date, Sürücü: a.driver, Məbləğ: a.sum, Qeyd: a.note || "" }))), "Sürücü avansı");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.driverReturns.map((rt) => ({ Tarix: rt.date, Vaxt: rt.time || "", Sürücü: rt.driver, "Gətirdiyi kq": rt.kg || "", Məbləğ: rt.sum, Qeyd: rt.note || "" }))), "Sürücü qaytarması");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.fuelLog.map((f) => ({ Tarix: f.date, Vaxt: f.time || "", Traktorist: f.tractorist, Litr: f.liters, Növ: f.type || "", Qeyd: f.note || "" }))), "Yanacaq");
    XLSX.writeFile(wb, `hamisi_${todayISO()}.xlsx`);
  }

  // ---------- Event wiring per tab ----------
  function attachTabEvents() {
    if (state.tab === "kassa") wireKassa();
    else if (state.tab === "purchases") wirePurchases();
    else if (state.tab === "sales") wireSales();
    else if (state.tab === "expenses") wireExpenses();
    else if (state.tab === "debts") wireDebts();
    else if (state.tab === "attendance") wireAttendance();
    else if (state.tab === "truck") wireTruck();
    else if (state.tab === "drivers") wireDrivers();
    else if (state.tab === "report") wireReport();
  }

  function wireKassa() {
    document.getElementById("kassaDate").onchange = (e) => { state.kassaDate = e.target.value; renderTabContent(); };
    const btnIn = document.getElementById("kassaTypeIn");
    const btnOut = document.getElementById("kassaTypeOut");
    function refreshToggle() {
      btnIn.className = "toggle-btn" + (kassaType === "in" ? " active-green" : "");
      btnOut.className = "toggle-btn" + (kassaType === "out" ? " active-red" : "");
    }
    refreshToggle();
    btnIn.onclick = () => { kassaType = "in"; refreshToggle(); document.getElementById("kassaSubmit").className = "btn green"; };
    btnOut.onclick = () => { kassaType = "out"; refreshToggle(); document.getElementById("kassaSubmit").className = "btn red"; };
    document.getElementById("kassaSubmit").onclick = async () => {
      const amount = Number(document.getElementById("kassaAmount").value);
      const note = document.getElementById("kassaNote").value;
      if (!amount) return;
      await addCashLog({ type: kassaType, sum: amount, note, date: state.kassaDate });
    };
    document.querySelectorAll("[data-del-cash]").forEach((btn) => {
      btn.onclick = () => deleteCashLog(btn.dataset.delCash);
    });
  }

  function wirePurchases() {
    document.getElementById("purchasesDate").onchange = (e) => { state.purchasesDate = e.target.value; renderTabContent(); };
    document.querySelectorAll("[data-nut-type]").forEach((btn) => {
      btn.onclick = () => { purchaseType = btn.dataset.nutType; renderTabContent(); };
    });
    function updateAvg() {
      const kg = Number(document.getElementById("pKg").value) || 0;
      const sum = Number(document.getElementById("pSum").value) || 0;
      const avg = kg > 0 && sum > 0 ? sum / kg : 0;
      document.getElementById("pAvgDisplay").innerHTML = avg > 0 ? `Orta qiymət: ${fmt(avg)} / kq (məlumat üçün)` : "";
    }
    document.getElementById("pKg").oninput = updateAvg;
    document.getElementById("pSum").oninput = updateAvg;
    updateAvg();
    document.getElementById("pSubmit").onclick = async () => {
      const kg = Number(document.getElementById("pKg").value);
      const sum = Number(document.getElementById("pSum").value);
      if (!kg || !sum) return;
      const supplier = document.getElementById("pSupplier").value.trim() || "Müştəri";
      const note = document.getElementById("pNote").value;
      const price = Number((sum / kg).toFixed(2));
      const paidNowRaw = document.getElementById("pPaidNow").value;
      const paidNow = paidNowRaw !== "" ? Number(paidNowRaw) : sum;
      await addPurchase({ supplier, kg, type: purchaseType, price, sum, note, paidNow, date: state.purchasesDate });
    };
    document.querySelectorAll("[data-del-purchase]").forEach((btn) => {
      btn.onclick = () => deletePurchase(btn.dataset.delPurchase);
    });
  }

  function wireSales() {
    document.getElementById("salesDate").onchange = (e) => { state.salesDate = e.target.value; renderTabContent(); };
    document.querySelectorAll("[data-sale-type]").forEach((btn) => {
      btn.onclick = () => { saleType = btn.dataset.saleType; renderTabContent(); };
    });
    document.getElementById("sSubmit").onclick = async () => {
      const kg = Number(document.getElementById("sKg").value);
      const sum = Number(document.getElementById("sSum").value);
      if (!kg || !sum) return;
      const buyer = document.getElementById("sBuyer").value.trim() || "Müştəri";
      const note = document.getElementById("sNote").value;
      await addSale({ buyer, kg, type: saleType, sum, note, date: state.salesDate });
    };
    document.querySelectorAll("[data-del-sale]").forEach((btn) => {
      btn.onclick = () => deleteSale(btn.dataset.delSale);
    });
    document.getElementById("salesTemplateBtn").onclick = downloadSalesTemplate;
    document.getElementById("salesImportFile").onchange = (e) => {
      const file = e.target.files[0];
      if (file) handleSalesFile(file);
    };
    const importConfirmBtn = document.getElementById("salesImportConfirm");
    if (importConfirmBtn) importConfirmBtn.onclick = commitSalesImport;
  }

  function wireExpenses() {
    document.querySelectorAll("[data-cat]").forEach((chip) => {
      chip.onclick = () => { expenseCategory = chip.dataset.cat; renderTabContent(); };
    });
    document.getElementById("eDate").onchange = (e) => { state.expenseDate = e.target.value; renderTabContent(); };
    document.getElementById("eSubmit").onclick = async () => {
      const category = document.getElementById("eCategory").value.trim();
      const sum = Number(document.getElementById("eSum").value);
      if (!category || !sum) return;
      const note = document.getElementById("eNote").value;
      const date = document.getElementById("eDate").value || todayISO();
      expenseCategory = "";
      state.expenseDate = date;
      await addExpense({ category, sum, note, date });
    };
    document.querySelectorAll("[data-del-expense]").forEach((btn) => {
      btn.onclick = () => deleteExpense(btn.dataset.delExpense);
    });
  }

  function wireDebts() {
    document.querySelectorAll("[data-debt-dir]").forEach((btn) => {
      btn.onclick = () => { debtDirection = btn.dataset.debtDir; renderTabContent(); };
    });
    document.getElementById("dSearch").oninput = (e) => { state.debtSearch = e.target.value; renderTabContent(); };
    document.getElementById("dSubmit").onclick = async () => {
      const person = document.getElementById("dPerson").value.trim();
      const sum = Number(document.getElementById("dSum").value);
      if (!person || !sum) return;
      const note = document.getElementById("dNote").value;
      await addDebt({ person, sum, direction: debtDirection, note });
    };
    document.querySelectorAll("[data-toggle-debt]").forEach((btn) => {
      btn.onclick = () => toggleDebtPaid(btn.dataset.toggleDebt);
    });
    document.querySelectorAll("[data-del-debt]").forEach((btn) => {
      btn.onclick = () => deleteDebtFn(btn.dataset.delDebt);
    });
    document.querySelectorAll("[data-repay-person]").forEach((btn) => {
      btn.onclick = async () => {
        const person = btn.dataset.repayPerson;
        const input = btn.closest(".card-box").querySelector(".ledgerRepaySum");
        const sum = Number(input.value);
        if (!sum) return;
        const ledger = buildPersonDebtLedger(person);
        const direction = ledger.finalBalance > 0 ? "took" : "gave";
        await addDebt({ person, sum, direction, note: "Qaytarma" });
      };
    });
  }

  function wireAttendance() {
    document.getElementById("attMonth").onchange = (e) => { state.attendanceMonth = e.target.value; renderTabContent(); };
    document.getElementById("addWorkerBtn").onclick = async () => {
      const name = document.getElementById("workerNameInput").value.trim();
      if (!name) return;
      await addWorker(name);
      document.getElementById("workerNameInput").value = "";
    };
    document.querySelectorAll("[data-del-worker]").forEach((btn) => {
      btn.onclick = () => removeWorker(btn.dataset.delWorker);
    });
    document.querySelectorAll("[data-att-cell]").forEach((btn) => {
      btn.onclick = () => {
        const [person, date] = btn.dataset.attCell.split("|");
        toggleAttendanceCell(person, date);
      };
    });
  }

  function wireTruck() {
    document.getElementById("truckDate").onchange = (e) => { state.truckDate = e.target.value; renderTabContent(); };
    document.querySelectorAll(".truckSupplier").forEach((inp) => {
      inp.oninput = (e) => {
        const row = state.truckEntries.find((r) => r.id === e.target.dataset.row);
        if (row) row.supplier = e.target.value;
      };
      inp.onblur = () => renderTabContent();
    });
    document.querySelectorAll(".truckKg").forEach((inp) => {
      inp.oninput = (e) => {
        const row = state.truckEntries.find((r) => r.id === e.target.dataset.row);
        if (row) row.kg = e.target.value;
      };
      inp.onblur = () => renderTabContent();
    });
    document.querySelectorAll(".truckBags").forEach((inp) => {
      inp.oninput = (e) => {
        const row = state.truckEntries.find((r) => r.id === e.target.dataset.row);
        if (row) row.bags = e.target.value;
      };
    });
    document.querySelectorAll("[data-del-truck-row]").forEach((btn) => {
      btn.onclick = () => {
        state.truckEntries = state.truckEntries.filter((r) => r.id !== btn.dataset.delTruckRow);
        renderTabContent();
      };
    });
    document.getElementById("truckAddRow").onclick = () => {
      state.truckEntries.push({ id: uid(), supplier: "", kg: "", bags: "" });
      renderTabContent();
    };
    document.getElementById("truckSubmit").onclick = async () => {
      const driver = document.getElementById("truckDriver").value.trim();
      const note = document.getElementById("truckNote").value;
      const loadDate = document.getElementById("truckLoadDate").value || state.truckDate;
      const validEntries = state.truckEntries.filter((e) => e.supplier.trim() && e.kg);
      if (!driver || validEntries.length === 0) return;
      await addTruckLoad({
        date: loadDate,
        driver,
        note,
        entries: validEntries.map((e) => ({ supplier: e.supplier.trim(), kg: Number(e.kg), bags: Number(e.bags) || 0 })),
      });
      state.truckEntries = [{ id: uid(), supplier: "", kg: "", bags: "" }];
      renderTabContent();
    };
    document.querySelectorAll("[data-del-truck]").forEach((btn) => {
      btn.onclick = () => deleteTruckLoad(btn.dataset.delTruck);
    });

    document.getElementById("addTractoristBtn").onclick = async () => {
      const name = document.getElementById("tractoristNameInput").value.trim();
      if (!name) return;
      await addTractorist(name);
      document.getElementById("tractoristNameInput").value = "";
    };
    document.querySelectorAll("[data-del-tractorist]").forEach((btn) => {
      btn.onclick = () => removeTractorist(btn.dataset.delTractorist);
    });
    document.querySelectorAll("[data-fuel-type]").forEach((btn) => {
      btn.onclick = () => { fuelType = btn.dataset.fuelType; renderTabContent(); };
    });
    document.getElementById("fuelSubmit").onclick = async () => {
      const tractorist = document.getElementById("fuelTractorist").value.trim();
      const liters = Number(document.getElementById("fuelLiters").value);
      if (!tractorist || !liters) return;
      const note = document.getElementById("fuelNote").value;
      const fuelDate = document.getElementById("fuelDate").value || state.truckDate;
      await addFuelLog({ date: fuelDate, tractorist, liters, type: fuelType, note });
      document.getElementById("fuelTractorist").value = "";
      document.getElementById("fuelLiters").value = "";
      document.getElementById("fuelNote").value = "";
    };
    document.querySelectorAll("[data-del-fuel]").forEach((btn) => {
      btn.onclick = () => deleteFuelLog(btn.dataset.delFuel);
    });
    document.getElementById("fuelMonth").onchange = (e) => { state.fuelMonth = e.target.value; renderTabContent(); };
  }

  function wireDrivers() {
    document.getElementById("driversDate").onchange = (e) => { state.driversDate = e.target.value; renderTabContent(); };

    document.getElementById("addDriverBtn").onclick = async () => {
      const name = document.getElementById("driverNameInput").value.trim();
      if (!name) return;
      await addDriver(name);
      document.getElementById("driverNameInput").value = "";
    };
    document.querySelectorAll("[data-del-driver]").forEach((btn) => {
      btn.onclick = () => removeDriver(btn.dataset.delDriver);
    });

    document.getElementById("advSubmit").onclick = async () => {
      const driver = document.getElementById("advDriver").value.trim();
      const sum = Number(document.getElementById("advSum").value);
      if (!driver || !sum) return;
      const note = document.getElementById("advNote").value;
      await addDriverAdvance({ driver, sum, note });
      document.getElementById("advDriver").value = "";
      document.getElementById("advSum").value = "";
      document.getElementById("advNote").value = "";
    };
    document.querySelectorAll("[data-del-adv]").forEach((btn) => {
      btn.onclick = () => deleteDriverAdvance(btn.dataset.delAdv);
    });

    document.getElementById("retSubmit").onclick = async () => {
      const driver = document.getElementById("retDriver").value.trim();
      const sum = Number(document.getElementById("retSum").value);
      if (!driver || !sum) return;
      const kg = Number(document.getElementById("retKg").value) || 0;
      const note = document.getElementById("retNote").value;
      await addDriverReturn({ date: state.driversDate, driver, sum, kg, note });
      document.getElementById("retDriver").value = "";
      document.getElementById("retSum").value = "";
      document.getElementById("retKg").value = "";
      document.getElementById("retNote").value = "";
    };
    document.querySelectorAll("[data-del-ret]").forEach((btn) => {
      btn.onclick = () => deleteDriverReturn(btn.dataset.delRet);
    });
  }

  function wireReport() {
    document.getElementById("reportDate").onchange = (e) => { state.reportDate = e.target.value; renderTabContent(); };
    document.getElementById("reportWhatsapp").onclick = () => {
      const text = buildReportText(state.reportDate);
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };
    document.getElementById("reportCopy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(buildReportText(state.reportDate));
        alert("Hesabat kopyalandı");
      } catch (e) {
        alert("Kopyalamaq mümkün olmadı");
      }
    };
    const excelDayBtn = document.getElementById("reportExcelDay");
    if (excelDayBtn) excelDayBtn.onclick = () => downloadDayExcel(state.reportDate);
    const excelAllBtn = document.getElementById("reportExcelAll");
    if (excelAllBtn) excelAllBtn.onclick = () => downloadAllExcel();
    const excelPrintBtn = document.getElementById("reportExcelPrint");
    if (excelPrintBtn) excelPrintBtn.onclick = () => downloadPrintableExcel(state.reportDate);

    const masterTemplateBtn = document.getElementById("masterTemplateBtn");
    if (masterTemplateBtn) masterTemplateBtn.onclick = downloadMasterTemplate;
    const masterImportFileInput = document.getElementById("masterImportFile");
    if (masterImportFileInput) {
      masterImportFileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) handleMasterImportFile(file);
      };
    }
    const masterImportConfirmBtn = document.getElementById("masterImportConfirm");
    if (masterImportConfirmBtn) masterImportConfirmBtn.onclick = commitMasterImport;
  }

  // ---------- Boot ----------
  // Prevent the browser's default behaviour of nudging a focused number input up/down
  // when the mouse wheel scrolls over it — this was silently corrupting typed amounts
  // (e.g. typing 135 while the page scrolls a notch could leave 133 or 134 instead).
  document.addEventListener(
    "wheel",
    () => {
      const el = document.activeElement;
      if (el && el.tagName === "INPUT" && el.type === "number") el.blur();
    },
    { passive: true }
  );

  if (!firebaseReady) {
    document.getElementById("app").innerHTML = '<div class="loading-screen">Firebase qoşulmadı. İnternet bağlantısını yoxlayın.</div>';
  } else {
    auth.onAuthStateChanged((user) => {
      state.user = user;
      state.authLoading = false;
      render();
    });
    initListeners();
    render();
  }
})();
</script>
</body>
</html>
